<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="style.css"><title>Neon Clock</title></head>
<body><main class="clock">
  <div class="top"><span class="live"><i></i> LIVE</span><span id="timezone">LOCAL TIME</span></div>
  <div id="time" class="time">00:00<span id="seconds">00</span></div>
  <div id="date" class="date">Загрузка даты…</div>
  <div class="bottom"><span class="sun">✦</span><span>MAKE TODAY COUNT</span><span id="ampm">24H</span></div>
</main><script src="main.js"></script></body></html>
