
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clock Widget</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: transparent;
            color: white;
            font-family: "Segoe UI", sans-serif;
        }

        .widget {
            padding: 20px;
            border-radius: 20px;
            background: rgba(25, 25, 35, 0.88);
            border: 1px solid rgba(255,255,255,0.12);
            text-align: center;
        }

        #time {
            font-size: 48px;
            font-weight: 600;
            letter-spacing: 2px;
        }

        #date {
            margin-top: 5px;
            color: #aaa;
            font-size: 15px;
        }
    </style>
</head>

<body>
    <div class="widget">
        <div id="time">00:00:00</div>
        <div id="date"></div>
    </div>

    <script>
        function updateClock() {
            const now = new Date();

            document.getElementById("time")
                .textContent = now.toLocaleTimeString("ru-RU");

            document.getElementById("date")
                .textContent = now.toLocaleDateString("ru-RU", {
                    weekday: "long",
                    day: "numeric",
                    month: "long"
                });
        }

        updateClock();
        setInterval(updateClock, 1000);
    </script>
</body>
</html>
