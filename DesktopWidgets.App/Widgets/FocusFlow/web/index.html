<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="style.css"><title>Focus Flow</title></head>
<body><main class="panel"><header><div><div class="eyebrow">FOCUS STUDIO</div><h1>Время<br><em>сосредоточиться.</em></h1></div><div class="mark">✳</div></header>
<nav><button class="mode active" data-min="25">Фокус</button><button class="mode" data-min="5">Перерыв</button><button class="mode" data-min="15">Длинный</button></nav>
<section class="timer"><svg viewBox="0 0 220 220"><circle class="track" cx="110" cy="110" r="96"/><circle id="progress" class="progress" cx="110" cy="110" r="96"/></svg><div class="digits"><strong id="display">25:00</strong><span id="status">ГОТОВ К СТАРТУ</span></div></section>
<div class="actions"><button id="toggle" class="primary">▶ Начать</button><button id="reset" class="reset" aria-label="Сбросить">↺</button></div><div class="foot"><span>✦ МАЛЕНЬКИЕ ШАГИ — БОЛЬШИЕ РЕЗУЛЬТАТЫ</span><span id="sessions">0 СЕССИЙ</span></div></main><script src="main.js"></script></body></html>
