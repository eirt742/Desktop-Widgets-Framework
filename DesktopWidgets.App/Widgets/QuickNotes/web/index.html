<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="style.css"><title>Quick Notes</title></head>
<body><main class="note"><header><div><div class="eyebrow">ЛИЧНОЕ ПРОСТРАНСТВО</div><h1>Мои заметки<span> ✎</span></h1></div><div class="save" id="save">● СОХРАНЕНО</div></header>
<div class="meta"><span id="today"></span><span>АВТОСОХРАНЕНИЕ</span></div>
<textarea id="text" placeholder="Запиши идею, задачу или мысль…"></textarea>
<footer><span id="count">0 символов</span><button id="clear">Очистить заметку ↗</button></footer></main><script src="main.js"></script></body></html>
