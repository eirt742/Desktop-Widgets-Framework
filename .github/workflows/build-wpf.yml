name: Build WPF application

on:
  push:
    branches:
      - main
      - rewrite/stable-widget-lifecycle
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore DesktopWidgets.App/DesktopWidgets.App.csproj

      - name: Build
        run: dotnet build DesktopWidgets.App/DesktopWidgets.App.csproj --configuration Release --no-restore
